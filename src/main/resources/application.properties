server.port=5000

# SQLite Datasource configuration
spring.datasource.url=jdbc:sqlite:data/dayflow.db
spring.datasource.driver-class-name=org.sqlite.JDBC

# JPA / Hibernate configuration for SQLite
spring.jpa.database-platform=org.hibernate.community.dialect.SQLiteDialect
spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=false
spring.jpa.properties.hibernate.format_sql=true

# JWT Secret Configuration (256-bit key)
jwt.secret=dayflow-spring-boot-jwt-secret-key-2026-very-secure-must-be-long-enough-for-hmac-sha-256
jwt.expiration-ms=86400000
